<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك بحث الألمانية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <div class="max-w-3xl mx-auto px-4 py-12">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">محرك بحث الأفعال الألمانية</h1>
            <p id="status" class="text-sm text-slate-500">جاري تحميل قاعدة البيانات...</p>
        </header>

        <div class="relative mb-4">
            <input type="text" id="searchBox" placeholder="اكتب كلمة للبحث (مثلاً: arbeiten, gehen, Dativ)..." 
                class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-lg bg-white"
                disabled onkeyup="searchWords()">
        </div>

        <div id="resultCount" class="text-sm font-semibold text-slate-600 mb-4 h-5"></div>

        <div id="results" class="space-y-3"></div>
    </div>

    <script>
        let searchIndex = [];
        const searchBox = document.getElementById('searchBox');
        const statusEl = document.getElementById('status');
        const resultCountEl = document.getElementById('resultCount');
        const resultsDiv = document.getElementById('results');

        // تحميل ملف الفهرس
        fetch('search-index.json')
            .then(res => res.json())
            .then(data => {
                searchIndex = data;
                searchBox.disabled = false;
                statusEl.textContent = `تم تحميل ${searchIndex.length} صفحة بنجاح، جاهز للبحث!`;
                statusEl.className = 'text-sm text-emerald-600 font-medium';
            })
            .catch(err => {
                statusEl.textContent = 'حدث خطأ أثناء تحميل ملف search-index.json تأكد من رفعه في نفس المجلد.';
                statusEl.className = 'text-sm text-red-600 font-medium';
            });

        function searchWords() {
            // استبدال الرمز - بـ – قبل معالجة النص
            let query = searchBox.value.replace(/-/g, '–').toLowerCase().trim();
            resultsDiv.innerHTML = '';
            resultCountEl.textContent = '';

            if (query.length < 2) return;

            let matches = searchIndex.filter(item => 
                item.content.toLowerCase().includes(query) || 
                item.title.toLowerCase().includes(query)
            );

            // ترتيب النتائج تصاعدياً بناءً على رقم الصفحة في الـ URL
            matches.sort((a, b) => {
                const getPageNum = (url) => {
                    const match = url.match(/\/(\d+)\.html/);
                    return match ? parseInt(match[1], 10) : 0;
                };
                return getPageNum(a.url) - getPageNum(b.url);
            });

            resultCountEl.textContent = `تم العثور على ${matches.length} نتيجة`;

            if (matches.length === 0) {
                resultsDiv.innerHTML = `<div class="p-4 bg-white rounded-xl border border-slate-200 text-center text-slate-500">لا توجد نتائج تطابق "${query}"</div>`;
                return;
            }

            matches.forEach(match => {
                let card = document.createElement('div');
                card.className = 'p-4 bg-white rounded-xl border border-slate-200 hover:shadow-md transition-shadow flex items-center justify-between';
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-blue-600 text-lg">${match.title}</h3>
                        <p class="text-xs text-slate-400 mt-1 truncate max-w-md">${match.url}</p>
                    </div>
                    <a href="${match.url}" target="_blank" class="px-4 py-2 bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-600 text-sm font-medium rounded-lg transition-colors">
                        فتح الصفحة ↗
                    </a>
                `;
                resultsDiv.appendChild(card);
            });
        }
    </script>
</body>
</html>
